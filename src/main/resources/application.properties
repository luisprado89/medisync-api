# ===========================================
# NOMBRE DE LA APLICACIÓN
# ===========================================
spring.application.name=MediSync
# ===========================================
# SERVIDOR
# ===========================================
server.port=${PORT:8080}
# ===========================================
# CONFIGURACIÓN DE PROXY (RAILWAY)
# ===========================================
# Permite que Spring Boot reconozca las cabeceras HTTPS del proxy de Railway
# Soluciona el error 'NetworkError' en Swagger UI al hacer peticiones desde la nube
server.forward-headers-strategy=framework

# ===========================================
# CONFIGURACIÓN DE BASE DE DATOS MYSQL
# ===========================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:medisync_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:abc123.}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================
# SPRING DATA JPA
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# CONFIGURACIÓN JWT
# ===========================================
jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1mb3Itand0LXRva2Vucy1tZWRpc3luYy1hcGktc3RyaW5nLTEyMzQ1Njc4OTA=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===========================================
# OPENAPI / SWAGGER
# ===========================================

# Escanea únicamente los controladores REST
springdoc.packages-to-scan=com.medisync.api.controller

# Ruta del documento OpenAPI (JSON)
springdoc.api-docs.path=/v3/api-docs

# Ruta de la interfaz Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Ordena las operaciones alfabéticamente
springdoc.swagger-ui.operationsSorter=alpha

# Ordena los controladores (tags) alfabéticamente
springdoc.swagger-ui.tagsSorter=alpha